[package]
name = "tower-ten"
description = "Adaptive concurrency limiter middleware for tower"
version = "0.1.1"
rust-version = "1.98"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hxragi/tower-ten"
keywords = ["tower", "middleware", "concurrency", "adaptive", "rate-limiting"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
pin-project-lite = { version = "0.2.17", default-features = false }
tower = { version = "0.5.3", default-features = false }
http = { version = "1.5.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
futures = { version = "0.3.34", default-features = false }

[features]
default = []
http = ["dep:http"]
